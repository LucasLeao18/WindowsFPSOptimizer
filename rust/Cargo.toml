[package]
name = "windows-fps-optimizer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
csv = "1"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Services", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wmi = "0.18"

