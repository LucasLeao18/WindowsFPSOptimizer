name: Windows build and installer validation

on:
  push:
    branches: [main, improvements/measured-gaming]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run integration and restoration tests
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('Test-IntegrationContracts', 'Smoke-Simulation', 'Test-BackupBaseline', 'Test-SidecarReconciliation')) {
            & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File ".\Tests\$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed: $LASTEXITCODE" }
          }

      - name: Build validated installer
        run: |
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\Build-WindowsFPSOptimizer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Test the final EXE on the disposable runner
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content .\Config.json -Raw | ConvertFrom-Json
          $version = [string]$config.App.Version
          $exe = (Resolve-Path ".\dist\WindowsFPSOptimizer-$version-Setup.exe").Path
          $info = Get-Content .\dist\WindowsFPSOptimizer-BuildInfo.json -Raw | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ne $info.Sha256) { throw 'EXE hash mismatch' }
          $process = Start-Process -FilePath $exe -ArgumentList '/quiet' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw 'Final installer timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Final installer failed: $($process.ExitCode)" }
          $installedRoot = Join-Path $env:ProgramFiles "WindowsFPSOptimizer\App\$version"
          $manifest = Get-Content .\.build\IExpress\Package\PackageManifest.json -Raw | ConvertFrom-Json
          foreach ($file in $manifest.Files) {
            $installedPath = Join-Path $installedRoot $file.Path
            if ((Get-FileHash -LiteralPath $installedPath -Algorithm SHA256).Hash -ne $file.Sha256) {
              throw "Installed file mismatch: $($file.Path)"
            }
          }
          Write-Host 'FINAL EXE VERIFIED: installation completed and installed files match the package manifest.'

      - name: Package source and provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string](Get-Content .\Config.json -Raw | ConvertFrom-Json).App.Version
          git archive --format=zip --prefix="WindowsFPSOptimizer-$version/" --output="dist/WindowsFPSOptimizer-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          [ordered]@{
            SourceCommit = $env:GITHUB_SHA
            Repository = $env:GITHUB_REPOSITORY
            RunUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            Runner = 'windows-2022'
            Version = $version
            FinalInstallerTest = 'Passed'
          } | ConvertTo-Json | Set-Content .\dist\BuildProvenance.json -Encoding UTF8
          Get-ChildItem .\dist -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content .\dist\SHA256SUMS.txt -Encoding ASCII

      - name: Upload validated release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
