name: Rust validation

on:
  push:
    branches: [rewrite/rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
        include:
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rust
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare Rust target
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
            & $installer -y --profile minimal --default-toolchain stable --default-host aarch64-pc-windows-msvc --no-modify-path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check diagnostics
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test and build
        run: |
          cargo test --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --target ${{ matrix.target }} tests/fixtures/idle_game.rs -o target/idle_game.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WFO_TEST_GAME = (Resolve-Path target/idle_game.exe).Path
          cargo test --locked --target ${{ matrix.target }} launches_fixture_and_restores_session -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target ${{ matrix.target }} recovers_priority_from_a_reopened_journal -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target ${{ matrix.target }} disposable_visual_profile_round_trip -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target ${{ matrix.target }} disposable_session_visual_round_trip -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target ${{ matrix.target }} temporary_sleep_guard_checks_identity_and_stops -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target ${{ matrix.target }} disposable_power_session_round_trip -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --target ${{ matrix.target }} --example service_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WFO_TEST_SERVICE_EXE = (Resolve-Path "target\${{ matrix.target }}\debug\examples\service_fixture.exe").Path
          cargo test --locked --target ${{ matrix.target }} disposable_service_round_trip -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check runtime DLL dependencies
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual C++ tools were not found' }
          $tools = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $tools.FullName 'bin\Hostx64\x64\dumpbin.exe'
          if (-not (Test-Path $dumpbin)) { $dumpbin = Join-Path $tools.FullName 'bin\Hostarm64\arm64\dumpbin.exe' }
          $exe = "target\${{ matrix.target }}\release\windows-fps-optimizer.exe"
          $imports = & $dumpbin /dependents $exe 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Dependency inspection failed: $imports" }
          $imports | Write-Output
          if ($imports -match '(?i)\b(vcruntime|msvcp|concrt)[a-z0-9_]*\.dll\b') {
            throw 'The executable requires a separate Visual C++ runtime DLL'
          }
      - name: Verify independent session monitor
        run: |
          $previousLocal = $env:LOCALAPPDATA
          $testLocal = Join-Path $env:RUNNER_TEMP ("wfo-monitor-" + [guid]::NewGuid().ToString('N'))
          $state = Join-Path $testLocal 'WindowsFPSOptimizerRust\State'
          New-Item -ItemType Directory -Path $state -Force | Out-Null
          $env:LOCALAPPDATA = $testLocal
          $fixture = $null
          $monitor = $null
          try {
            $fixture = Start-Process -FilePath (Resolve-Path target/idle_game.exe).Path -WindowStyle Hidden -PassThru
            $identity = @{ pid = $fixture.Id; created = $fixture.StartTime.ToFileTimeUtc() }
            $record = @{ schema = 1; process = $identity; original = 'Normal'; applied = 'AboveNormal'; phase = 'Applied' }
            $journal = Join-Path $state 'session.json'
            $record | ConvertTo-Json -Compress | Set-Content -LiteralPath $journal -Encoding utf8NoBOM
            $exe = (Resolve-Path "target\${{ matrix.target }}\release\windows-fps-optimizer.exe").Path
            $monitor = Start-Process -FilePath $exe -ArgumentList '--session-monitor' -WindowStyle Hidden -PassThru
            if (-not $monitor.WaitForExit(30000)) { throw 'Session monitor did not exit after the isolated game' }
            if ($monitor.ExitCode -ne 0 -or (Test-Path -LiteralPath $journal)) { throw 'Session monitor did not finalize the isolated game journal' }
          } finally {
            if ($monitor -and -not $monitor.HasExited) { $monitor.Kill() }
            if ($fixture -and -not $fixture.HasExited) { $fixture.Kill() }
            $env:LOCALAPPDATA = $previousLocal
          }
      - name: Smoke test graphical compatibility paths
        run: |
          $exe = (Resolve-Path "target\${{ matrix.target }}\release\windows-fps-optimizer.exe").Path
          $env:WFO_SMOKE_LOG = Join-Path $env:RUNNER_TEMP 'wfo-renderer-smoke.log'
          foreach ($arguments in @('--smoke-test', '--smoke-test --renderer-fallback', '--smoke-test --native-fallback')) {
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              throw "Graphical smoke test timed out: $arguments"
            }
            if ($process.ExitCode -ne 0) {
              if (Test-Path $env:WFO_SMOKE_LOG) { Get-Content $env:WFO_SMOKE_LOG | Write-Output }
              throw "Graphical smoke test failed ($($process.ExitCode)): $arguments"
            }
            Write-Output "Compatibility startup passed: $arguments"
          }
          Remove-Item -LiteralPath $env:WFO_SMOKE_LOG -ErrorAction SilentlyContinue
          $env:WGPU_BACKEND = 'metal'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test --renderer-fallback' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Forced fallback timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $env:WFO_SMOKE_LOG) -or -not ((Get-Content $env:WFO_SMOKE_LOG -Raw) -match 'renderer=wgpu')) {
            if (Test-Path $env:WFO_SMOKE_LOG) { Get-Content $env:WFO_SMOKE_LOG | Write-Output }
            throw 'The native fallback was not verified after renderer failure'
          }
          Remove-Item Env:WGPU_BACKEND
      - name: Save test executable for diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostic-${{ matrix.os }}-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/windows-fps-optimizer.exe
          if-no-files-found: ignore
          retention-days: 1

  package-preview:
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download validated 64-bit build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: diagnostic-windows-2022-x86_64-pc-windows-msvc
          path: preview-input/x64
      - name: Download validated 32-bit build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: diagnostic-windows-2022-i686-pc-windows-msvc
          path: preview-input/x86
      - name: Download validated ARM64 build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: diagnostic-windows-11-arm-aarch64-pc-windows-msvc
          path: preview-input/arm64
      - name: Assemble preview and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path preview -Force | Out-Null
          $binaries = [ordered]@{
            'WindowsFPSOptimizer-Rust-x64-preview.exe' = 'preview-input/x64/windows-fps-optimizer.exe'
            'WindowsFPSOptimizer-Rust-x86-preview.exe' = 'preview-input/x86/windows-fps-optimizer.exe'
            'WindowsFPSOptimizer-Rust-arm64-preview.exe' = 'preview-input/arm64/windows-fps-optimizer.exe'
          }
          foreach ($name in $binaries.Keys) {
            if (-not (Test-Path -LiteralPath $binaries[$name] -PathType Leaf)) { throw "Validated executable missing: $name" }
            Copy-Item -LiteralPath $binaries[$name] -Destination (Join-Path preview $name)
            if ((Get-FileHash -LiteralPath $binaries[$name] -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath (Join-Path preview $name) -Algorithm SHA256).Hash) { throw "Copy verification failed: $name" }
          }
          [ordered]@{
            Status = 'Development preview; not a final release'
            SourceCommit = $env:GITHUB_SHA
            Repository = $env:GITHUB_REPOSITORY
            ValidationRun = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            Builds = @('Windows 64-bit', 'Windows 32-bit', 'Windows ARM64')
          } | ConvertTo-Json | Set-Content -LiteralPath preview/BuildInfo.json -Encoding utf8NoBOM
          Get-ChildItem -LiteralPath preview -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath preview/SHA256SUMS.txt -Encoding ascii
      - name: Upload development preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-development-preview
          path: preview/*
          if-no-files-found: error
          retention-days: 7
